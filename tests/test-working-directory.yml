name: Test tfsec working_directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: tfsec
        name: Run tfsec on a specific subdirectory
        uses: .
        continue-on-error: true
        with:
          working_directory: tests/fixtures/tf-subdir/subdir
          soft_fail: "true"
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Assert tfsec ran on subdirectory successfully or failed gracefully
        env:
          OUTCOME: ${{ steps.tfsec.outcome }}
          RETURN_CODE: ${{ steps.tfsec.outputs.tfsec-return-code }}
        run: |
          echo "outcome: $OUTCOME"
          echo "tfsec-return-code: $RETURN_CODE"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: tfsec ran on subdirectory with soft_fail=true"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: tfsec step failed gracefully (Docker/network limitation in act environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
