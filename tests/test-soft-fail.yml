name: Test tfsec soft_fail with security issues
on:
  workflow_dispatch:

jobs:
  test-soft-fail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: tfsec
        name: Run tfsec with soft_fail on Terraform with issues
        uses: .
        with:
          working_directory: tests/fixtures/tf-issues
          soft_fail: "true"

      - name: Assert step completed despite security issues
        run: |
          echo "tfsec step completed with soft_fail=true"
          echo "PASS: tfsec ran and did not break the build due to soft_fail"
