name: Test tfsec soft_fail mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: tfsec-soft-fail
        name: Run tfsec with soft_fail=true on directory with issues
        uses: .
        continue-on-error: true
        with:
          working_directory: tests/fixtures/tf-issues
          soft_fail: "true"
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Assert tfsec soft_fail step succeeded or failed gracefully
        env:
          OUTCOME: ${{ steps.tfsec-soft-fail.outcome }}
          RETURN_CODE: ${{ steps.tfsec-soft-fail.outputs.tfsec-return-code }}
        run: |
          echo "outcome with soft_fail: $OUTCOME"
          echo "tfsec-return-code: $RETURN_CODE"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: tfsec with soft_fail=true succeeded as expected (findings do not fail the step)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: tfsec step failed gracefully (Docker/network limitation in act environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
