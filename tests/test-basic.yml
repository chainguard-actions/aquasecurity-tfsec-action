name: Test basic tfsec scan (clean directory)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: tfsec
        name: Run tfsec on clean Terraform directory
        uses: .
        continue-on-error: true
        with:
          working_directory: tests/fixtures/tf-clean
          soft_fail: "true"
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Assert tfsec ran (success or graceful failure)
        env:
          OUTCOME: ${{ steps.tfsec.outcome }}
          RETURN_CODE: ${{ steps.tfsec.outputs.tfsec-return-code }}
        run: |
          echo "outcome: $OUTCOME"
          echo "tfsec-return-code: $RETURN_CODE"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: tfsec completed successfully on clean directory"
            echo "return code: $RETURN_CODE"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: tfsec step failed gracefully (Docker/network limitation in act environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
