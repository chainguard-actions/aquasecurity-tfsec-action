name: Test tfsec with JSON format and additional args
on:
  workflow_dispatch:

jobs:
  test-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: tfsec
        name: Run tfsec with JSON format
        uses: .
        with:
          working_directory: tests/fixtures/tf-clean
          format: json
          soft_fail: "true"
          additional_args: "--force-all-dirs"

      - name: Assert tfsec ran with JSON format
        run: |
          echo "tfsec step completed with JSON format"
          echo "PASS: tfsec ran with format=json and additional_args"
