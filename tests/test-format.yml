name: Test tfsec format input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: tfsec-json
        name: Run tfsec with JSON format output
        uses: .
        continue-on-error: true
        with:
          working_directory: tests/fixtures/tf-clean
          format: json
          soft_fail: "true"
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Assert tfsec ran with JSON format
        env:
          OUTCOME: ${{ steps.tfsec-json.outcome }}
          RETURN_CODE: ${{ steps.tfsec-json.outputs.tfsec-return-code }}
        run: |
          echo "outcome: $OUTCOME"
          echo "tfsec-return-code: $RETURN_CODE"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: tfsec ran with json format and soft_fail=true"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: tfsec step failed gracefully (Docker/network limitation in act environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
